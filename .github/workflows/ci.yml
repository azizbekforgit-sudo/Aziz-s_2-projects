name: CI

# Runs on every push and pull request. If any step fails, do not merge / deploy.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: talent_to_impact
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d talent_to_impact"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/talent_to_impact?schema=public
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else-123456
      AUTH_TRUST_HOST: "true"
      SEED_ADMIN_EMAIL: admin@talenttoimpact.uz
      SEED_ADMIN_PASSWORD: ci-admin-password-123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prisma schema is valid and formatted
        run: npm run db:check
      - run: npx prisma generate
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Prepare database
        run: npx prisma db push --skip-generate && npm run db:seed
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (build + start + browser)
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
